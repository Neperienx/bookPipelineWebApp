<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Book Pipeline{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <style>
      body {
        background: linear-gradient(130deg, #f6d3b1, #fff2e6);
        min-height: 100vh;
        color: #3c2a1f;
        position: relative;
        overflow-x: hidden;
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 45% 55% 60% 40%;
        background: radial-gradient(circle, rgba(230, 166, 109, 0.35), transparent 70%);
        z-index: 0;
        pointer-events: none;
      }
      body::before {
        top: -120px;
        right: -140px;
      }
      body::after {
        bottom: -160px;
        left: -140px;
      }
      .navbar {
        background: rgba(255, 239, 220, 0.9);
        border-bottom: 1px solid rgba(165, 115, 82, 0.2);
        z-index: 1;
      }
      .content-container {
        padding: 2rem 1rem 4rem;
        position: relative;
        z-index: 1;
      }
      .card {
        background: rgba(255, 248, 240, 0.95);
        border: 1px solid rgba(165, 115, 82, 0.2);
        box-shadow: 0 20px 40px rgba(171, 110, 69, 0.15);
        border-radius: 1.25rem;
      }
      .list-group-item {
        background: rgba(255, 246, 236, 0.9);
        color: #3c2a1f;
        border-color: rgba(165, 115, 82, 0.2);
      }
      .list-group-item:hover,
      .list-group-item:focus {
        background: rgba(246, 204, 162, 0.35);
        color: #3c2a1f;
      }
      textarea.form-control, input.form-control, select.form-select {
        background: rgba(255, 252, 248, 0.95);
        border: 1px solid rgba(165, 115, 82, 0.3);
        color: #3c2a1f;
      }
      textarea.form-control:focus, input.form-control:focus, select.form-select:focus {
        background: rgba(255, 252, 248, 0.98);
        color: #3c2a1f;
        border-color: #d97c4a;
        box-shadow: 0 0 0 0.2rem rgba(217, 124, 74, 0.2);
      }
      .text-secondary,
      .text-muted,
      .text-body-secondary {
        color: #6f5646 !important;
      }
    </style>
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">Story Projects</a>
      </div>
    </nav>
    <main class="content-container">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
